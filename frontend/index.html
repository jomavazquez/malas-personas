<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malas Personas · Online party card games for teams</title>
    <!-- Prerendered pages (scripts/prerender.mjs) show #prerender until React has painted #root.
         The prerender is in English, so it is hidden for Spanish visitors to avoid a language flash. -->
    <style>#prerender ~ #root { display: none; } .mp-es #prerender { display: none; }</style>
    <script>
      try {
        var langs = [localStorage.getItem("mp_language")].concat(navigator.languages || [navigator.language]);
        var lang = langs.filter(function (l) { return /^(es|en)/i.test(l || ""); })[0] || "en";
        if (/^es/i.test(lang)) document.documentElement.classList.add("mp-es");
      } catch (e) {}
    </script>
    <meta name="description" content="Free online party games for your team or friends: a Cards Against Humanity-style card game and Truth or Lie. Share a room code and play from any browser." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Malas Personas" />
    <meta property="og:title" content="Malas Personas · Online party card games for teams" />
    <meta property="og:description" content="Free online party games for your team or friends. Share a room code and play from any browser, in English or Spanish." />
    <meta property="og:image" content="https://www.malaspersonas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Malas Personas: bring out the wild side of your team. A black question card and two white answer cards." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.malaspersonas.com/#organization",
            "name": "Malas Personas",
            "url": "https://www.malaspersonas.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.malaspersonas.com/logo.png",
              "width": 512,
              "height": 512
            },
            "email": "hola@malaspersonas.com"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.malaspersonas.com/#website",
            "name": "Malas Personas",
            "url": "https://www.malaspersonas.com/",
            "inLanguage": ["en", "es"],
            "publisher": { "@id": "https://www.malaspersonas.com/#organization" }
          },
          {
            "@type": "VideoGame",
            "name": "Malas Personas",
            "url": "https://www.malaspersonas.com/",
            "description": "Free online party games for teams and friends: a card game where a judge picks the funniest answer, and Truth or Lie (two truths and a lie). Up to 20 players, played in real time from any browser.",
            "image": "https://www.malaspersonas.com/og-image.png",
            "genre": ["Party game", "Card game"],
            "gamePlatform": "Web browser",
            "applicationCategory": "GameApplication",
            "playMode": "MultiPlayer",
            "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 20 },
            "inLanguage": ["en", "es"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "isPartOf": { "@id": "https://www.malaspersonas.com/#website" },
            "publisher": { "@id": "https://www.malaspersonas.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
